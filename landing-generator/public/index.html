<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Landing Generator</title><style>:root{--ink:#17202a;--bg:#f7f8fc;--panel:#fff;--accent:#5b5bd6;--line:#e4e6ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.shell{min-height:100vh}.top{height:64px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.brand{font-weight:900;font-size:18px}.muted{color:#798094}.btn{background:var(--accent);color:#fff;border-radius:10px;padding:10px 15px;font-weight:800}.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.layout{display:grid;grid-template-columns:260px 1fr;height:calc(100vh - 64px)}aside{background:#fff;border-right:1px solid var(--line);padding:16px;overflow:auto}.project{padding:12px;border-radius:10px;margin:5px 0;cursor:pointer}.project.active{background:#eef0ff;color:var(--accent);font-weight:800}.main{display:grid;grid-template-columns:minmax(260px,38%) 1fr;min-width:0}.chat,.preview{min-width:0}.chat{display:flex;flex-direction:column;border-right:1px solid var(--line);background:#fff}.chat-head,.preview-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.messages{flex:1;padding:18px;overflow:auto}.msg{padding:12px 14px;border-radius:14px;margin:9px 0;line-height:1.45;white-space:pre-wrap}.msg.user{background:#eef0ff;margin-left:15%}.msg.assistant{background:#f2f3f6;margin-right:8%}.composer{padding:14px;border-top:1px solid var(--line)}textarea{width:100%;resize:none;border:1px solid var(--line);border-radius:12px;padding:12px;min-height:90px}.row{display:flex;gap:8px;margin-top:8px}.preview iframe{width:100%;height:calc(100% - 57px);border:0;background:#fff}.empty{padding:22px;color:#798094}.login{display:grid;place-items:center;min-height:100vh}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;width:min(420px,calc(100% - 30px));box-shadow:0 16px 50px #19204012}.card h1{margin-top:0}.field{display:block;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin:10px 0}.mobile-tabs{display:none}@media(max-width:800px){.layout{display:block}.layout aside{height:auto;border:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow:auto}.project{white-space:nowrap}.main{display:block;height:calc(100vh - 150px)}.chat,.preview{height:100%}.preview{display:none}.main.show-preview .chat{display:none}.main.show-preview .preview{display:block}.mobile-tabs{display:flex;gap:8px;padding:8px;background:#fff;border-bottom:1px solid var(--line)}.main{height:calc(100vh - 198px)}}.hint{font-size:12px;color:#798094;margin-top:10px}</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s);let state={projects:[],current:null,preview:false};
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Ошибка');return j}
function renderLogin(setup=false){$('#app').innerHTML=`<main class="login"><form class="card" id="auth"><h1>${setup?'Настройка генератора':'Вход в генератор'}</h1><p class="muted">${setup?'Задайте пароль администратора. Сохраняется только хеш.':'Введите пароль для продолжения.'}</p><input class="field" name="password" type="password" minlength="8" required placeholder="Пароль"><button class="btn">${setup?'Создать защищённое приложение':'Войти'}</button><div class="hint">Минимум 8 символов. Пароль не передаётся в чат.</div></form></main>`;$('#auth').onsubmit=async e=>{e.preventDefault();try{await api(setup?'/api/setup':'/api/login',{method:'POST',body:JSON.stringify({password:e.target.password.value})});await boot()}catch(x){alert(x.message)}}}
async function boot(){const s=await api('/api/status');if(!s.authenticated){renderLogin(s.setup);return}state.projects=await api('/api/projects');renderApp();if(state.projects[0])openProject(state.projects[0].id)}
function renderApp(){document.querySelector('#app').innerHTML=`<div class="shell"><header class="top"><div class="brand">✦ Landing Generator</div><div class="muted">Приватная мастерская</div></header><div class="layout"><aside><button class="btn" id="new">+ Новый проект</button><div id="projects"></div></aside><div class="main" id="main"><div class="mobile-tabs"><button class="btn ghost" id="tabChat">Чат</button><button class="btn ghost" id="tabPreview">Превью</button></div><section class="chat"><div class="chat-head"><strong id="projectTitle">Выберите проект</strong><button class="btn ghost" id="rename">Переименовать</button></div><div class="messages" id="messages"><div class="empty">Создайте проект и опишите лендинг в чате.</div></div><form class="composer" id="composer"><textarea name="message" placeholder="Например: сделай лендинг для студии керамики..."></textarea><div class="row"><button class="btn">Создать / изменить</button><button type="button" class="btn ghost" id="publish">Опубликовать</button></div></form></section><section class="preview"><div class="preview-head"><strong>Изолированное превью</strong><span class="muted" id="previewUrl"></span></div><iframe id="frame" sandbox="allow-forms"></iframe></section></div></div></div>`;renderProjects();$('#new').onclick=newProject;$('#composer').onsubmit=sendMessage;$('#publish').onclick=publish;$('#rename').onclick=rename;$('#tabChat').onclick=()=>$('#main').classList.remove('show-preview');$('#tabPreview').onclick=()=>$('#main').classList.add('show-preview')}
function renderProjects(){$('#projects').innerHTML=state.projects.filter(p=>!p.deletedAt).map(p=>`<div class="project ${state.current?.id===p.id?'active':''}" data-id="${p.id}">${esc(p.name)}</div>`).join('');document.querySelectorAll('.project').forEach(x=>x.onclick=()=>openProject(x.dataset.id))}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
async function newProject(){const p=await api('/api/projects',{method:'POST',body:JSON.stringify({name:'Новый проект'})});state.projects.unshift(p);openProject(p.id)}
async function openProject(id){state.current=await api('/api/projects/'+id);renderProjects();$('#projectTitle').textContent=state.current.name;$('#messages').innerHTML=state.current.messages?.length?state.current.messages.map(m=>`<div class="msg ${m.role}">${esc(m.text)}</div>`).join(''):'<div class="empty">Опишите задачу: нишу, аудиторию, стиль и нужное действие.</div>';const u='/published/'+state.current.slug+'/';$('#frame').src=u;$('#previewUrl').textContent=u;$('#messages').scrollTop=999999}
async function sendMessage(e){e.preventDefault();if(!state.current)return alert('Сначала создайте проект');const ta=e.target.message;const message=ta.value.trim();if(!message)return;ta.value='';const optimistic={role:'user',text:message};$('#messages').insertAdjacentHTML('beforeend',`<div class="msg user">${esc(message)}</div><div class="msg assistant">Генерирую черновик...</div>`);try{const r=await api('/api/projects/'+state.current.id+'/chat',{method:'POST',body:JSON.stringify({message})});state.current=r.project;await openProject(state.current.id)}catch(x){alert(x.message)}}
async function rename(){if(!state.current)return;const name=prompt('Новое название проекта',state.current.name);if(name){state.current=await api('/api/projects/'+state.current.id,{method:'PATCH',body:JSON.stringify({name})});await openProject(state.current.id)}}
async function publish(){if(!state.current)return alert('Сначала выберите проект');const r=await api('/api/projects/'+state.current.id+'/publish',{method:'POST',body:'{}'});alert('Опубликовано: '+location.origin+r.url);openProject(state.current.id)}
boot();
</script></body></html>
